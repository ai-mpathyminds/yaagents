[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaagents-fastapi"
dynamic = ["version"]
description = "YAAgents FastAPI SDK — Agentic REST Profile v0.3 (spec/agentic-rest-profile.md)"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "Apache-2.0" }
keywords = ["yaagents", "agentic", "REST", "fastapi", "profile-v0.3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.111",
]

[project.urls]
Homepage = "https://github.com/ai-mpathyminds/yaagents"
"Supports-YAAgents-Profile" = "v0.3"

[tool.hatch.version]
path = "src/yaagents_fastapi/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yaagents_fastapi"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pip-audit>=2.7",
]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yaagents_fastapi --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["yaagents_fastapi"]
omit = ["src/yaagents_fastapi/__about__.py"]
