openapi: "3.1.0"
info:
  title: YAAgents Reusable Components
  version: "0.3.0"
  description: >
    Reusable OpenAPI 3.1 components for the YAAgents Agentic REST Response
    Profile v0.3. Import via $ref into any service OpenAPI document.
    Authoritative source: spec/agentic-rest-profile.md.
    v0.3 adds SSE streaming contract (§11) and updates schema refs to schemas/v0.3/.

components:

  # -----------------------------------------------------------------------
  # Headers
  # -----------------------------------------------------------------------
  headers:
    X-Correlation-ID:
      description: >
        Cross-service correlation identifier. Propagated from the inbound
        request; gateway generates a UUID v4 when absent.
      schema:
        type: string
        minLength: 1
      required: false

    X-Request-ID:
      description: >
        Per-request unique identifier. Propagated from the inbound request;
        gateway generates a UUID v4 when absent.
      schema:
        type: string
        minLength: 1
      required: false

    X-Tenant-ID:
      description: >
        Tenant identifier extracted from the JWT or supplied by the caller.
        Used by the gateway for tenant-scoped RBAC and audit.
      schema:
        type: string
        minLength: 1
      required: false

    X-YAAgents-Profile:
      description: >
        Identifies the YAAgents Agentic REST Response Profile version
        implemented by the gateway. Value is "v0.3" for this release.
        Clients MAY inspect this header for version negotiation.
      schema:
        type: string
        enum:
          - v0.3
      required: false

  # -----------------------------------------------------------------------
  # Schemas — one per vendor media type; each $ref to schemas/v0.3/
  # -----------------------------------------------------------------------
  schemas:
    ClarificationRequired:
      description: >
        Body for application/vnd.yaagents.clarification+json (HTTP 400).
        Source schema: schemas/v0.3/clarification-required.schema.json
      $ref: "../schemas/v0.3/clarification-required.schema.json"

    ValidationFailed:
      description: >
        Body for application/vnd.yaagents.validation-error+json (HTTP 422).
        Source schema: schemas/v0.3/validation-failed.schema.json
      $ref: "../schemas/v0.3/validation-failed.schema.json"

    ApprovalRequired:
      description: >
        Body for application/vnd.yaagents.approval-required+json (HTTP 412).
        Source schema: schemas/v0.3/approval-required.schema.json
      $ref: "../schemas/v0.3/approval-required.schema.json"

    Conflict:
      description: >
        Body for application/vnd.yaagents.conflict+json (HTTP 409).
        Source schema: schemas/v0.3/conflict.schema.json
      $ref: "../schemas/v0.3/conflict.schema.json"

    AgenticError:
      description: >
        Body for application/vnd.yaagents.error+json (HTTP 403/424/500).
        Covers forbidden, failed_dependency, and error response types.
        Source schema: schemas/v0.3/agentic-error.schema.json
      $ref: "../schemas/v0.3/agentic-error.schema.json"

    OperationAccepted:
      description: >
        Body for application/vnd.yaagents.operation+json (HTTP 202).
        Source schema: schemas/v0.3/operation-accepted.schema.json
      $ref: "../schemas/v0.3/operation-accepted.schema.json"

  # -----------------------------------------------------------------------
  # Responses — keyed by the §4 normative table response types
  # -----------------------------------------------------------------------
  responses:

    # HTTP 202 — accepted (async operation)
    OperationAccepted:
      description: >
        The operation was accepted for asynchronous processing.
        Content-Type: application/vnd.yaagents.operation+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.operation+json:
          schema:
            $ref: "#/components/schemas/OperationAccepted"

    # HTTP 400 — clarification_required
    ClarificationRequired:
      description: >
        The agent requires additional inputs before it can proceed.
        Content-Type: application/vnd.yaagents.clarification+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.clarification+json:
          schema:
            $ref: "#/components/schemas/ClarificationRequired"

    # HTTP 412 — approval_required
    ApprovalRequired:
      description: >
        The operation requires explicit human approval before execution.
        Content-Type: application/vnd.yaagents.approval-required+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.approval-required+json:
          schema:
            $ref: "#/components/schemas/ApprovalRequired"

    # HTTP 422 — validation_failed
    ValidationFailed:
      description: >
        The request inputs failed validation.
        Content-Type: application/vnd.yaagents.validation-error+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.validation-error+json:
          schema:
            $ref: "#/components/schemas/ValidationFailed"

    # HTTP 403 — forbidden
    Forbidden:
      description: >
        The caller lacks permission to perform this operation.
        Content-Type: application/vnd.yaagents.error+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.error+json:
          schema:
            $ref: "#/components/schemas/AgenticError"

    # HTTP 409 — conflict
    Conflict:
      description: >
        A conflicting resource state prevents the operation.
        Content-Type: application/vnd.yaagents.conflict+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.conflict+json:
          schema:
            $ref: "#/components/schemas/Conflict"

    # HTTP 424 — failed_dependency
    FailedDependency:
      description: >
        An upstream dependency failed preventing this operation.
        Content-Type: application/vnd.yaagents.error+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.error+json:
          schema:
            $ref: "#/components/schemas/AgenticError"

    # HTTP 500 — error
    InternalError:
      description: >
        An internal server error occurred.
        Content-Type: application/vnd.yaagents.error+json
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/X-Correlation-ID"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        X-YAAgents-Profile:
          $ref: "#/components/headers/X-YAAgents-Profile"
      content:
        application/vnd.yaagents.error+json:
          schema:
            $ref: "#/components/schemas/AgenticError"
