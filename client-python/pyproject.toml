[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaagents-client"
dynamic = ["version"]
description = "YAAgents Python client — Agentic REST Profile v0.2"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "Apache-2.0" }
keywords = ["yaagents", "agentic", "REST", "client", "profile-v0.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ai-mpathyminds/yaagents"
"Supports-YAAgents-Profile" = "v0.2"

[tool.hatch.version]
path = "src/yaagents_client/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yaagents_client"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yaagents_client --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["yaagents_client"]
omit = ["src/yaagents_client/__about__.py"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]
