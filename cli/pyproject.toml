[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaagents-cli"
dynamic = ["version"]
description = "YAAgents CLI — Agentic REST Profile v0.3 validator"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "Apache-2.0" }
keywords = ["yaagents", "agentic", "REST", "cli", "validator", "profile-v0.3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ai-mpathyminds/yaagents"
"Supports-YAAgents-Profile" = "v0.3"

[project.scripts]
yaagents = "yaagents_cli:main"

[tool.hatch.version]
path = "src/yaagents_cli/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yaagents_cli"]
# _schemas/ is under src/yaagents_cli/ so packages= already bundles it;
# force-include was redundant and caused a duplicate-path error in hatchling ≥1.27.
# Removed at WI-2yaa.REL-1 (platform-engineer packaging fix, 2026-06-02).

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "yaml"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yaagents_cli --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["yaagents_cli"]
omit = ["src/yaagents_cli/__about__.py"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]
