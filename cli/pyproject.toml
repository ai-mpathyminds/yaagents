[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaagents-cli"
dynamic = ["version"]
description = "YAAgents CLI — Agentic REST Profile v0.1 validator"
readme = "README.md"
requires-python = ">=3.11,<4"
keywords = ["yaagents", "agentic", "REST", "cli", "validator", "profile-v0.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/ai-mpathyminds/yaagents"
"Supports-YAAgents-Profile" = "v0.1"

[project.scripts]
yaagents = "yaagents_cli.__main__:_entry"

[tool.hatch.version]
path = "src/yaagents_cli/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yaagents_cli"]

# Include bundled schemas
[tool.hatch.build.targets.wheel.force-include]
"src/yaagents_cli/_schemas" = "yaagents_cli/_schemas"

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yaagents_cli --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["yaagents_cli"]
omit = ["src/yaagents_cli/__about__.py"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]
