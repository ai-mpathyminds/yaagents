# campaign-api-go — gateway route configuration (WI-3yaa.SG-6)
# Maps POST /campaigns/{id}/optimizations to http://campaign-api-go:8121.
# ADR: PI1-yaa-0001 (HS256 demo JWT; tenantRequired; RBAC on optimizations).
#
# Demo flows enabled by this file:
#   flow 5 (auth-failure 401) — POST /campaigns/{id}/optimizations without
#                               Authorization header; token-validator rejects.
#   flow 2 (created 201)     — POST with valid JWT + goal field (via gateway).
#   flow 1/3/4               — exercised directly against port 8121 in test_e2e.sh.

routes:
  # ── POST /campaigns/{id}/optimizations ──────────────────────────────────────
  # roles: non-empty → gateway enforces RBAC; missing token → 401 (token-validator);
  #        token lacks "campaign:optimize" → 403.
  # tenantRequired: true → request without X-Tenant-ID header is rejected.
  # audit: true          → every call emits a structured audit log entry.
  - id: create-optimization
    method: POST
    path: /campaigns/{id}/optimizations
    target: http://campaign-api-go:8121
    roles:
      - campaign:optimize
    tenantRequired: true
    audit: true

  # ── GET /healthz (passthrough — no auth required) ────────────────────────────
  - id: healthz
    method: GET
    path: /healthz
    target: http://campaign-api-go:8121
    tenantRequired: false
    audit: false
