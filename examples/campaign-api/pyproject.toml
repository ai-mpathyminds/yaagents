[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaagents-campaign-api"
version = "0.1.0"
description = "Campaign API — YAAgents Agentic REST Profile v0.1 reference example"
readme = "README.md"
requires-python = ">=3.11,<4"
keywords = ["yaagents", "agentic", "REST", "fastapi", "profile-v0.1", "example"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "yaagents-fastapi>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/ai-mpathyminds/yaagents"
"Supports-YAAgents-Profile" = "v0.1"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_api"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "e2e: end-to-end tests requiring the live Compose demo at http://localhost:8120",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "anyio[trio]>=4",
    "yaagents-cli>=0.1.0",
    "yaagents-client>=0.1.0",
    "pyyaml>=6",
]
