# yaagents Compose Demo -- campaign-api reference example
# ports: 8120 (gateway), 8121 (campaign-api) -- portfolio band 8120-8129
#
# SECURITY NOTE: GATEWAY_JWT_SECRET below is a DEMO-ONLY hardcoded token.
# Never use this value in production. For production, set GATEWAY_JWT_JWKS_URL
# instead.
#
# NFR-refined by platform-engineer at A-4 (compose-linter clean, 11/11 checks).

name: yaagents-demo

services:
  yaagents-gateway:
    # Build from local gateway source (docker/gateway/Dockerfile, context: gateway/)
    # dockerfile path is relative to the build context (gateway/../docker/gateway/Dockerfile)
    build:
      context: ../../gateway
      dockerfile: ../docker/gateway/Dockerfile
    ports:
      - "8120:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_ROUTES_FILE: /etc/yaagents/routes.yaml
      GATEWAY_JWT_SECRET: "demo-secret-not-for-production"   # demo only; see SECURITY NOTE
      GATEWAY_AUDIT_LOG: stdout
    volumes:
      - ./routes.yaml:/etc/yaagents/routes.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.50"
    networks:
      - yaagents-net
    depends_on:
      campaign-api:
        condition: service_healthy
    restart: on-failure

  campaign-api:
    # Build context is the yaagents repo root so Dockerfile can reach sdk-fastapi/
    build:
      context: ../..
      dockerfile: examples/campaign-api/Dockerfile
    # Internal port 8121 -- not exposed to the host (gateway proxies)
    expose:
      - "8121"
    environment:
      PORT: "8121"
      YAAGENTS_PROFILE_VERSION: "v0.2"   # bumped to v0.2 healthcheck:
      # python:slim images do not ship wget; use python3 urllib instead
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8121/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    volumes:
      - campaign-data:/app/data
    networks:
      - yaagents-net
    restart: on-failure

volumes:
  campaign-data:        # named -- no anonymous volumes

networks:
  yaagents-net:         # named network -- intra-product isolation
