# yaagents store example — Docker Compose
# ports: 8120 (gateway), 8121 (store) — portfolio band 8120-8129
# Uses published yaagents-gateway:0.3.0 image from GHCR.
#
# SECURITY NOTE: GATEWAY_JWT_SECRET below is a DEMO-ONLY hardcoded value.
# Never use this value in production. Set GATEWAY_JWT_JWKS_URL instead
# (see gateway documentation).

name: yaagents-store

services:
  yaagents-gateway:
    image: ghcr.io/ai-mpathyminds/yaagents-gateway:0.3.0
    ports:
      - "8120:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_ROUTES_FILE: /etc/yaagents/routes.yaml
      GATEWAY_JWT_SECRET: "demo-secret-not-for-production"   # demo only; see SECURITY NOTE
      GATEWAY_AUDIT_LOG: stdout
    volumes:
      - ./routes.yaml:/etc/yaagents/routes.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.50"
    networks:
      - yaagents-net
    depends_on:
      store:
        condition: service_healthy
    restart: on-failure

  store:
    build: .
    ports:
      - "8121:8080"
    environment:
      PORT: "8080"
    healthcheck:
      # python:slim images do not ship wget; use python3 urllib instead
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    networks:
      - yaagents-net
    restart: on-failure

networks:
  yaagents-net:    # named network — intra-example isolation
