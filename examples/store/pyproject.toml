[project]
name = "yaagents-store-example"
version = "0.3.0"
description = "yaagents ecommerce reference example — product recommendations endpoint"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "yaagents-fastapi>=0.3.0",
]
license = "Apache-2.0"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store"]
