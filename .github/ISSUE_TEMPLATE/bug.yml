name: Bug Report
description: Report a defect in the gateway, SDK, client, CLI, or spec.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        For **security vulnerabilities**, use the process in [SECURITY.md](../../SECURITY.md) instead of this template.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of YAAgents is affected?
      multiple: false
      options:
        - gateway (Go)
        - sdk-fastapi (Python FastAPI server SDK)
        - client-python (Python client)
        - client-ts (TypeScript client)
        - cli (yaagents-cli validator)
        - spec / schemas / OpenAPI components
        - examples / Docker Compose demo
        - other / unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / image tag
      description: e.g. `0.1.0`, `ghcr.io/ai-mpathyminds/yaagents-gateway:0.1.0`, `yaagents-client==0.1.0`
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: |
        Minimal curl command, Python/TypeScript snippet, or docker compose config.
        Include the full HTTP request and response (status + body).
      placeholder: |
        curl -X POST http://localhost:8120/campaigns/c-001/optimizations \
          -H "Authorization: Bearer dev-token" \
          -d '{"budget_delta": 500}'
        # Expected: 200 with application/vnd.yaagents.result+json
        # Got: 500 Internal Server Error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Paste the full HTTP response or error output.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, language runtime versions.
      placeholder: |
        OS: Ubuntu 22.04 / macOS 14 / Windows 11
        Docker: 26.1.0
        Go: 1.22.3  (if building gateway from source)
        Python: 3.11.8
        Node: 20.12.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or gateway output
      description: Paste structured JSON log lines if available. Redact secrets and tokens.
      render: json

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is a bug, not a feature request or question.
          required: true
        - label: I am not reporting a security vulnerability (I used SECURITY.md for that).
          required: true
