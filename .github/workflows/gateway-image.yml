# .github/workflows/gateway-image.yml
# WI-1yaa.REL-5 — GHCR gateway image (multi-arch, OIDC, SBOM)
# WI-1yaa.NFR-REL-1 — SBOM SPDX 2.3 JSON via syft (OQ-5 resolution)
# ADR PI1-yaa-0005 — OIDC trusted publishing; no PAT, no long-lived token
#
# Publishes:
#   ghcr.io/ai-mpathyminds/yaagents-gateway:<semver>
#   ghcr.io/ai-mpathyminds/yaagents-gateway:latest
# Platforms:  linux/amd64, linux/arm64
# Auth:       GITHUB_TOKEN (packages: write) — OIDC; no PAT
# SBOM:       SPDX 2.3 JSON (syft / anchore/sbom-action) → attached to Release
# Scan:       trivy image scan HIGH+CRITICAL (exit 1 on unpatched findings)
# Cosign:     deferred to PI2-yaa (ADR PI1-yaa-0005 §4)

# PUBLISH PARKED 2026-05-24 — yaagents is private for now; do NOT auto-publish the
# GHCR image. Re-enable the tag trigger below at public launch (PI-yaa public seed).
on:
  workflow_dispatch: {}   # manual-only; tag-push auto-publish disabled while private
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'   # v0.1.0, v1.2.3, …

permissions:
  contents: write          # create / update GitHub Release + upload SBOM asset
  packages: write          # push image to ghcr.io via GITHUB_TOKEN
  security-events: write   # upload Trivy SARIF to GitHub Security tab

jobs:
  build-push-scan:
    name: Build → push → scan → SBOM
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/ai-mpathyminds/yaagents-gateway

    steps:
      # ── checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── multi-arch emulation ─────────────────────────────────────────────
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GHCR auth — GITHUB_TOKEN OIDC; no PAT (ADR PI1-yaa-0005 §3) ──────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── tag + label derivation ────────────────────────────────────────────
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # ── build + push (multi-arch) ─────────────────────────────────────────
      # Build context: gateway/  Dockerfile: docker/gateway/Dockerfile
      # CGO_ENABLED=0 static binary; non-root runtime user (see Dockerfile)
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: docker/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # ── Trivy image scan ─────────────────────────────────────────────────
      # Scan by digest (not mutable tag) so the exact pushed image is checked.
      # exit-code: 1 — CI fails on any unpatched HIGH or CRITICAL finding.
      # ignore-unfixed: true — advisory-only; non-actionable vulns don't block.
      - name: Trivy image scan (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()   # upload results even if the scan step fails
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # ── SBOM — SPDX 2.3 JSON (syft / anchore/sbom-action) ───────────────
      # OQ-5 resolution: SPDX 2.3 JSON, platform-engineer A-4 pick.
      # See: docs/PI1-yaa/release-and-publish.md §OQ-5 resolution
      # Cosign SBOM attestation = PI2-yaa (ADR PI1-yaa-0005 §4) — NOT here.
      - name: Generate SBOM — SPDX 2.3 JSON (syft)
        uses: anchore/sbom-action@v0.17.9
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true          # also available as workflow artifact
          upload-release-assets: false   # we attach via softprops below

      # ── attach SBOM to GitHub Release ────────────────────────────────────
      # Creates the release if it does not exist; uploads sbom.spdx.json.
      # AC (WI-1yaa.NFR-REL-1): Release asset `sbom.spdx.json` present;
      #   spdxVersion == "SPDX-2.3"; name == IMAGE:semver-tag; valid JSON.
      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
