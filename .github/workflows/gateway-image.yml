# .github/workflows/gateway-image.yml
# WI-4yaa.LA-GHCR — GHCR gateway image publish @ 0.4.0 (multi-arch + Cosign + SBOM)
# WI-2yaa.REL-3   — re-publish @ 0.2.0 (multi-arch + SBOM)
# WI-1yaa.REL-5 — original authoring; updated for v0.2 Apache 2.0 OCI label
# WI-1yaa.NFR-REL-1 — SBOM SPDX 2.3 JSON via syft (OQ-5 resolution)
# ADR PI1-yaa-0005 — OIDC trusted publishing; no PAT, no long-lived token; Cosign keyless §4
# ADR PI2-yaa-0003 — Apache 2.0 license metadata; OCI licenses label flip
# ADR PI4-yaa-0002 — multi-IDP token-validator plugin (ships in 0.4.0 image)
#
# Publishes:
#   ghcr.io/ai-mpathyminds/yaagents-gateway:<semver>
#   ghcr.io/ai-mpathyminds/yaagents-gateway:latest
# Platforms:  linux/amd64, linux/arm64
# Auth:       GITHUB_TOKEN (packages: write) — OIDC; no PAT
# SBOM:       SPDX 2.3 JSON (syft / anchore/sbom-action) → Cosign-attached + GH Release
# Scan:       trivy image scan HIGH+CRITICAL (exit 1 on unpatched findings)
# Cosign:     keyless OIDC sign + attach sbom (ADR PI1-yaa-0005 §4; implemented PI4-yaa)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v0.4.0, v1.2.3, …

permissions:
  contents: write          # create / update GitHub Release + upload SBOM asset
  packages: write          # push image to ghcr.io via GITHUB_TOKEN
  security-events: write   # upload Trivy SARIF to GitHub Security tab
  id-token: write          # Cosign keyless OIDC signing (ADR PI1-yaa-0005 §4)

jobs:
  build-push-scan:
    name: Build → push → scan → SBOM
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/ai-mpathyminds/yaagents-gateway

    steps:
      # ── checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── PRE-PUBLISH GATE: community-license grep ────────────────────────────
      # WI-2yaa.REL-3 + NFR-REL-1: zero "YAAgents Community License" hits in
      # gateway Go source before the image is built and pushed.
      # Prevents a regression from reaching the public GHCR registry.
      # ADR PI2-yaa-0003.
      - name: license-clean-scan (pre-publish gate)
        run: |
          if grep -rn "YAAgents Community License" \
               --include='*.go' \
               gateway/; then
            echo "::error::Community License string found in gateway Go source — cannot publish image. See ADR PI2-yaa-0003."
            exit 1
          fi
          echo "license-clean-scan: PASS — no Community License strings found in gateway/"

      # ── multi-arch emulation ─────────────────────────────────────────────
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GHCR auth — GITHUB_TOKEN OIDC; no PAT (ADR PI1-yaa-0005 §3) ──────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── tag + label derivation ────────────────────────────────────────────
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      # ── build + push (multi-arch) ─────────────────────────────────────────
      # Build context: gateway/  Dockerfile: docker/gateway/Dockerfile
      # CGO_ENABLED=0 static binary; non-root runtime user (see Dockerfile)
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: docker/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # ── Cosign: install + keyless image signing ────────────────────────────
      # ADR PI1-yaa-0005 §4: keyless Cosign signing using GitHub Actions OIDC.
      # Requires id-token: write (granted above).
      # Produces a Rekor transparency-log entry verifiable via:
      #   cosign verify --certificate-identity-regexp '.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/ai-mpathyminds/yaagents-gateway:<tag>
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (Cosign keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      # ── OCI license label verification ───────────────────────────────────
      # WI-2yaa.REL-3 AC: docker inspect ... labels["org.opencontainers.image.licenses"]
      # must return "Apache-2.0". Scanned by digest for immutability.
      # ADR PI2-yaa-0003 (was LicenseRef-YAAgents-Community-License-v0.1 in PI1-yaa).
      - name: Verify OCI licenses label (Apache-2.0)
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          LABEL=$(docker inspect "${{ env.IMAGE }}@${DIGEST}" \
            | jq -r '.[0].Config.Labels["org.opencontainers.image.licenses"] // empty')
          if [ "${LABEL}" != "Apache-2.0" ]; then
            echo "::error::OCI licenses label=${LABEL:-<absent>} — expected Apache-2.0 (ADR PI2-yaa-0003)"
            exit 1
          fi
          echo "OK  org.opencontainers.image.licenses=${LABEL}"

      # ── Trivy image scan ─────────────────────────────────────────────────
      # WI-2yaa.NFR-GW-2 [SEC + SUPPLY]: step name trivy-scan (per acceptance
      # criterion). Scan by digest (not mutable tag) so the exact pushed image
      # is checked. exit-code: 1 — CI fails on any unpatched HIGH or CRITICAL
      # finding. ignore-unfixed: true — advisory-only; non-actionable vulns
      # don't block. Alpine base-layer HIGH finding → base-image bump WI next
      # sprint before publish proceeds.
      - name: trivy-scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()   # upload results even if the scan step fails
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # ── SBOM — SPDX 2.3 JSON (syft / anchore/sbom-action) ───────────────
      # OQ-5 resolution: SPDX 2.3 JSON, platform-engineer A-4 pick.
      # See: release-and-publish design doc §OQ-5 resolution
      # Cosign SBOM attach follows below (WI-4yaa.LA-GHCR; ADR PI1-yaa-0005 §4).
      - name: Generate SBOM — SPDX 2.3 JSON (syft)
        uses: anchore/sbom-action@v0.17.9
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true          # also available as workflow artifact
          upload-release-assets: false   # we attach via softprops below

      # ── Cosign: attach SBOM to image ─────────────────────────────────────
      # WI-4yaa.LA-GHCR AC: `cosign download sbom <image>` returns SPDX JSON.
      # cosign attach sbom links the sbom.spdx.json to the image digest in the
      # OCI registry, making it retrievable via `cosign download sbom`.
      - name: Attach SBOM to image via Cosign
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            --type spdx \
            ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      # ── attach SBOM to GitHub Release ────────────────────────────────────
      # Creates the release if it does not exist; uploads sbom.spdx.json.
      # AC (WI-1yaa.NFR-REL-1): Release asset `sbom.spdx.json` present;
      #   spdxVersion == "SPDX-2.3"; name == IMAGE:semver-tag; valid JSON.
      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
