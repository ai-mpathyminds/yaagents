# .github/workflows/pypi-publish.yml
# WI-4yaa.LA-PYPI-1/2/3 — PyPI publish ×3 @ 0.4.0 (OIDC Trusted Publisher)
# WI-2yaa.REL-1 — first re-publish @ 0.2.0; WI-1yaa.REL-3 — original authoring
# ADR PI1-yaa-0003 — Hatch build; ADR PI1-yaa-0005 — OIDC; no API token
# ADR PI2-yaa-0003 — Apache 2.0 license metadata
# ADR PI4-yaa-0001 — AuditEmitter contract (yaagents-fastapi 0.4.0 carries new audit symbols)
#
# Packages: yaagents-fastapi | yaagents-client | yaagents-cli
# Flow:     license-clean-scan (gate) → build → TestPyPI (gate) → PyPI publish
# Auth:     PyPI Trusted Publisher OIDC (id-token: write); zero long-lived token
#
# External setup (Phase-B dependency, one per package):
#   PyPI Trusted Publisher registration pointing to this workflow +
#   environment "pypi" (and testpypi → "testpypi") must be configured by
#   the repo owner on pypi.org / test.pypi.org before the prod publish step
#   can succeed.  The workflow itself has no secrets to manage.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v0.4.0, v1.2.3, …

jobs:
  # ── 1. Build all three packages ─────────────────────────────────────────────
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── PRE-PUBLISH GATE: community-license grep ────────────────────────────
      # WI-2yaa.REL-1 + NFR-REL-1: zero "YAAgents Community License" hits in
      # Python source before any wheel is built. Prevents a regression from
      # reaching a public registry. ADR PI2-yaa-0003.
      - name: license-clean-scan (pre-publish gate)
        run: |
          if grep -rn "YAAgents Community License" \
               --include='*.py' \
               sdk-fastapi client-python cli; then
            echo "::error::Community License string found in Python sources — cannot publish. See ADR PI2-yaa-0003."
            exit 1
          fi
          echo "license-clean-scan: PASS — no Community License strings found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hatch
        run: pip install hatch==1.12.0

      - name: Get version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build yaagents-fastapi
        working-directory: sdk-fastapi
        run: hatch build

      - name: Build yaagents-client
        working-directory: client-python
        run: hatch build

      - name: Build yaagents-cli
        working-directory: cli
        run: hatch build

      - name: Upload sdk-fastapi dist
        uses: actions/upload-artifact@v4
        with:
          name: sdk-fastapi-dist
          path: sdk-fastapi/dist/
          if-no-files-found: error

      - name: Upload client-python dist
        uses: actions/upload-artifact@v4
        with:
          name: client-python-dist
          path: client-python/dist/
          if-no-files-found: error

      - name: Upload cli dist
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist/
          if-no-files-found: error

  # ── 2a. Publish to TestPyPI — yaagents-fastapi ─────────────────────────────
  publish-testpypi-fastapi:
    name: TestPyPI — yaagents-fastapi
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi   # env protection limits which refs can publish
    permissions:
      id-token: write       # OIDC Trusted Publisher; no API token

    steps:
      - name: Download sdk-fastapi dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-fastapi-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true   # idempotent re-runs

  # ── 2b. Publish to TestPyPI — yaagents-client ──────────────────────────────
  publish-testpypi-client:
    name: TestPyPI — yaagents-client
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download client-python dist
        uses: actions/download-artifact@v4
        with:
          name: client-python-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ── 2c. Publish to TestPyPI — yaagents-cli ─────────────────────────────────
  publish-testpypi-cli:
    name: TestPyPI — yaagents-cli
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download cli dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ── 3. Verify TestPyPI installs ─────────────────────────────────────────────
  # Gate: all three TestPyPI publishes must succeed before production publish.
  # Dependencies pulled from pypi.org via --extra-index-url (TestPyPI only
  # hosts the yaagents packages, not fastapi/httpx/jsonschema/pyyaml).
  verify-testpypi:
    name: Verify TestPyPI installs
    needs:
      - publish-testpypi-fastapi
      - publish-testpypi-client
      - publish-testpypi-cli
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Small delay — TestPyPI CDN may take a moment to propagate the upload.
      - name: Wait for TestPyPI propagation
        run: sleep 20

      - name: Install from TestPyPI (with pypi.org for deps)
        run: |
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "yaagents-fastapi==${{ steps.ver.outputs.version }}" \
            "yaagents-client==${{ steps.ver.outputs.version }}" \
            "yaagents-cli==${{ steps.ver.outputs.version }}"

      - name: Smoke-test profile declarations + license + Supports-YAAgents-Profile
        run: |
          # WI-4yaa.LA-PYPI-1/2/3 acceptance criteria (v0.4.0):
          #   - All three wheels report License: Apache-2.0  (ADR PI2-yaa-0003)
          #   - All three wheels declare Supports-YAAgents-Profile: v0.3
          #   - Module __profile__ == "v0.3" on all three (Profile unchanged in v0.4)
          python - <<'EOF'
          import importlib.metadata as im
          from yaagents_fastapi import __version__ as fv, __profile__ as fp
          from yaagents_client  import __version__ as cv, __profile__ as cp
          # yaagents_cli.__init__ does not re-export __profile__; import from __about__
          from yaagents_cli import __version__ as lv
          from yaagents_cli.__about__ import __profile__ as lp

          assert fv == cv == lv, f"version mismatch: {fv} {cv} {lv}"
          assert fp == cp == lp == "v0.3", f"profile mismatch: {fp} {cp} {lp} — expected v0.3 (Profile unchanged in v0.4; ADR PI4-yaa-0001)"
          print(f"OK  version={fv}  profile={fp}")

          PKGS = ["yaagents-fastapi", "yaagents-client", "yaagents-cli"]
          for pkg in PKGS:
              meta = im.metadata(pkg)
              # License assertion (PEP 621 license.text → License header in METADATA)
              lic = meta.get("License-Expression") or meta.get("License") or ""
              assert "Apache-2.0" in str(lic), \
                  f"{pkg}: License={lic!r} — expected Apache-2.0 (ADR PI2-yaa-0003)"
              # Supports-YAAgents-Profile assertion via Project-URL header
              # pyproject.toml [project.urls] "Supports-YAAgents-Profile" = "v0.3"
              # → Project-URL: Supports-YAAgents-Profile, v0.3 in wheel METADATA
              urls = meta.get_all("Project-URL") or []
              assert any(
                  "Supports-YAAgents-Profile" in u and "v0.3" in u for u in urls
              ), f"{pkg}: Supports-YAAgents-Profile: v0.3 not found. Project-URLs={urls}"
              print(f"PASS  {pkg}  License={lic}  Supports-YAAgents-Profile: v0.3")
          EOF

      - name: Smoke-test AuditEmitter symbols (WI-4yaa.SG-04 + ADR PI4-yaa-0001)
        run: |
          # LA-PYPI-1 acceptance: AuditEmitter + AuditEvent + NoopEmitter importable from
          # yaagents_fastapi; AgenticContext.audit_emit round-trip with NoopEmitter is no-op.
          python - <<'EOF'
          import asyncio
          import inspect
          from yaagents_fastapi import AuditEmitter, AuditEvent, NoopEmitter, __version__
          from yaagents_fastapi.context import AgenticContext

          # Protocol structural check
          assert inspect.iscoroutinefunction(NoopEmitter.emit), \
              "NoopEmitter.emit must be async (AuditEmitter Protocol)"

          # AuditEvent dataclass round-trip — all 10 fields present
          ev = AuditEvent(event_type="agentic.test.check")
          assert ev.event_type == "agentic.test.check"
          assert ev.tenant_id == "" and ev.actor_id == "" and ev.outcome == ""
          assert ev.attributes == {}

          # NoopEmitter no-op — does not raise
          asyncio.run(NoopEmitter().emit(ev))

          print(f"PASS  AuditEmitter/AuditEvent/NoopEmitter symbols verified  version={__version__}")
          EOF

      - name: Smoke-test [otel] extra install (WI-4yaa.LA-PYPI-1 acceptance)
        run: |
          # LA-PYPI-1 acceptance: pip install yaagents-fastapi[otel] succeeds + pulls opentelemetry-sdk
          pip install --quiet \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "yaagents-fastapi[otel]==${{ steps.ver.outputs.version }}"
          python -c "import opentelemetry.sdk; print('PASS  [otel] extra pulls opentelemetry-sdk')"

      - name: Smoke-test CLI entrypoint
        run: yaagents --help

  # ── 4a. Publish to production PyPI — yaagents-fastapi ──────────────────────
  # Only runs after TestPyPI gate passes.  Uses a separate GH Actions
  # environment "pypi" so protection rules enforce tag-only deploys.
  publish-pypi-fastapi:
    name: PyPI — yaagents-fastapi
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download sdk-fastapi dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-fastapi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── 4b. Publish to production PyPI — yaagents-client ───────────────────────
  publish-pypi-client:
    name: PyPI — yaagents-client
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download client-python dist
        uses: actions/download-artifact@v4
        with:
          name: client-python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── 4c. Publish to production PyPI — yaagents-cli ──────────────────────────
  publish-pypi-cli:
    name: PyPI — yaagents-cli
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download cli dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
