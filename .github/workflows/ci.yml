# .github/workflows/ci.yml
# WI-1yaa.REL-6 — CI test/lint matrix + spec release archive
#
# Language/quality jobs (all must pass; ci-go has ≥80% coverage gate):
#   ci-go                 Go  — golangci-lint + govulncheck + go test
#   e2e-tokenvalidator    Go  — 6-scenario multi-IDP e2e gate (WI-4yaa.PLG-03)
#                               exit-0 pre-merge gate per PLG-03 acceptance criteria
#   e2e-tenantinjector    Go  — 5-scenario webhook-resolution e2e gate (WI-4yaa.PLG-06)
#                               exit-0 pre-merge gate per PLG-06 acceptance criteria
#   e2e-licensecheck      Go  — 6-scenario allow/deny-matrix e2e gate (WI-4yaa.PLG-09)
#                               exit-0 pre-merge gate per PLG-09 acceptance criteria
#   e2e-promptsanitize    Go  — 5-scenario PII corpus e2e gate (WI-4yaa.PLG-12)
#                               exit-0 pre-merge gate per PLG-12 acceptance criteria
#   ci-python   Py  — ruff + mypy + pip-audit + pytest  (matrix: 3 packages)
#   ci-ts       TS  — eslint + tsc --noEmit + pnpm audit + vitest
#
# spec-archive: on tag push only, after all CI green — attaches
#   schemas/ + openapi/ zip to the GitHub Release (ADR PI1-yaa-0005 §6).

on:
  push:
    branches: ['**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read   # default for all jobs; spec-archive overrides to write

# Cancel in-progress runs on the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go: golangci-lint + govulncheck + go test ─────────────────────────────
  ci-go:
    name: Go — lint + vuln + test (≥80% cov)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # golangci-lint runs the linter set declared in gateway/.golangci.yml
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: gateway

      # govulncheck scans for known Go vulnerabilities (OSV database).
      # Step name govulncheck-gateway (WI-2yaa.NFR-GW-2 [SEC]): whole-module
      # scan covering plugin chain, LLM specialisation, token-validator JWKS
      # client. Exits 1 on any HIGH/CRITICAL finding; 0 findings expected on
      # v0.2.0 tagged commit.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck-gateway
        run: govulncheck ./...

      # govulncheck focused on plugin packages — NFR-PLG-1 explicit gate (SEC).
      # The ./... step above is the whole-module gate; this named step makes the
      # plugin-specific acceptance criterion directly traceable to NFR-PLG-1.
      # Covers token-validator JWKS fetch / TLS paths (the only plugin with
      # outbound HTTP dependency).  CI fails on any finding affecting the code.
      - name: govulncheck-plugins
        run: govulncheck ./internal/plugins/...

      # go test with race detector and coverage profiling
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Enforce ≥80% total statement coverage
      - name: Enforce ≥80% coverage gate
        run: |
          TOTAL=$(go tool cover -func=coverage.out \
            | grep '^total:' | awk '{gsub(/%/,"",$3); printf "%d\n", $3}')
          echo "Go total coverage: ${TOTAL}%"
          if [ "${TOTAL}" -lt 80 ]; then
            echo "::error::Go coverage ${TOTAL}% is below the 80% gate"
            exit 1
          fi

  # ── Go client-go: govulncheck + math/rand absence ───────────────────────
  # WI-2yaa.NFR-GOC-1 [SEC]: belt-and-suspenders gates for the zero-non-stdlib
  # client-go module.
  #   govulncheck-client-go — OSV scan; exits 1 on any HIGH/CRITICAL finding
  #   no-mathr-rand-client-go — grep gate; exits 1 on any "math/rand" match in
  #                             *.go files; enforces PRD §10 crypto/rand floor
  #                             for UUID v4 generation (GOC-1 brief).
  # The govulncheck gate is expected trivially clean (zero non-stdlib runtime
  # deps per PRD §5.9) but MUST be wired so future transitive deps are caught
  # automatically.
  ci-go-client:
    name: Go client-go — govulncheck + no-math/rand
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go-version-file is relative to the repo root, not working-directory.
      # client-go has no external deps so go.sum does not exist; omit
      # cache-dependency-path to avoid a missing-file error.
      - name: Set up Go (from client-go/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # govulncheck: scan the client-go module for known Go vulnerabilities.
      # Zero non-stdlib runtime deps → expected zero findings on v0.2.0 commit.
      # WI-2yaa.NFR-GOC-1 acceptance criterion: exits 0 on clean, 1 on any
      # HIGH/CRITICAL finding.
      - name: govulncheck-client-go
        run: govulncheck ./...

      # math/rand absence gate: UUID v4 MUST use crypto/rand (PRD §10).
      # Scans all *.go files under client-go/; exits 1 if any match found.
      # WI-2yaa.NFR-GOC-1 acceptance criterion: exits 0 on clean codebase;
      # exits 1 when math/rand is injected (verified by test-branch injection).
      - name: no-mathr-rand-client-go
        run: |
          HITS=$(grep -rn --include="*.go" "math/rand" .)
          if [ -n "$HITS" ]; then
            echo "${HITS}"
            echo "::error::math/rand found in client-go — UUID v4 MUST use crypto/rand (PRD §10 secure-randomness floor). Replace all math/rand usages with crypto/rand."
            exit 1
          fi
          echo "no-mathr-rand-client-go: PASS — no math/rand usage found in client-go"

  # ── token-validator multi-IDP e2e gate ──────────────────────────────────
  # WI-4yaa.PLG-03 acceptance criterion: "CI workflow job e2e-tokenvalidator
  # runs go test ./internal/plugins/tokenvalidator/ -run E2E -v on every PR
  # and on merge to main; must exit 0 before merge."
  #
  # 6 scenarios: issA valid→200+claim-headers, issB valid→200, audience-
  # mismatch→403, unknown-issuer→403, JWKS-unavailable→503, expired→401.
  # A-4 NFR: per-issuer claim_mappings principal attribution asserted in-test.
  # No Docker / testcontainers needed — mock JWKS servers are httptest.Server.
  # Runs independently of ci-go so failures are reported distinctly.
  e2e-tokenvalidator:
    name: E2E — token-validator multi-IDP (6 scenarios, exit-0 gate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # Verify no t.Skip* calls slipped into the e2e file (integration-test-discipline).
      - name: Assert no t.Skip in e2e test file
        run: |
          HITS=$(grep -n "t\.Skip\|t\.SkipNow\|t\.Skipf" \
                   internal/plugins/tokenvalidator/tokenvalidator_e2e_test.go \
                 | grep -v "^[0-9]*:[[:space:]]*//" || true)
          if [ -n "$HITS" ]; then
            echo "${HITS}"
            echo "::error::t.Skip* call found in tokenvalidator_e2e_test.go — integration-test-discipline forbids silent skip; use t.Fatal"
            exit 1
          fi
          echo "no-skip-assert: PASS"

      # Exit-0 pre-merge gate: all 6 multi-IDP e2e scenarios must pass.
      # Timeout guard: 120s wall-clock cap per PLG-03 acceptance criteria.
      - name: e2e-tokenvalidator (exit-0 pre-merge gate)
        run: go test -count=1 -timeout 120s -run E2E -v ./internal/plugins/tokenvalidator/...

  # ── tenant-injector webhook-resolution e2e gate ─────────────────────────
  # WI-4yaa.PLG-06 acceptance criterion: "CI workflow job e2e-tenantinjector
  # runs go test ./internal/plugins/tenantinjector/ -run E2E -v on every PR
  # and on merge to main; must exit 0 before merge."
  #
  # 5 scenarios (as-shipped contract per ADR PI4-yaa-0003, revised B-02):
  #   1. Webhook success → 200 + X-Tenant-ID + X-Actor-Principal injected
  #   2. Webhook 404 → on_failure.principal_not_found (403)
  #   3. Webhook unreachable → on_failure.lookup_network_error (503)
  #   4. Cache hit — second identical-principal request → 0 extra webhook calls
  #   5. Cache miss after TTL — next request after expiry → 1 extra webhook call
  # No Docker / testcontainers needed — mock webhook server is httptest.Server.
  # Runs independently of ci-go so failures are reported distinctly.
  e2e-tenantinjector:
    name: E2E — tenant-injector webhook resolution (5 scenarios, exit-0 gate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # Verify no t.Skip* calls slipped into the e2e file (integration-test-discipline).
      # Comment-only lines (// ...) are excluded from the match.
      - name: Assert no t.Skip in e2e test file
        run: |
          HITS=$(grep -n "t\.Skip\|t\.SkipNow\|t\.Skipf" \
                   internal/plugins/tenantinjector/tenantinjector_e2e_test.go \
                 | grep -v "^[0-9]*:[[:space:]]*//" || true)
          if [ -n "$HITS" ]; then
            echo "${HITS}"
            echo "::error::t.Skip* call found in tenantinjector_e2e_test.go — integration-test-discipline forbids silent skip; use t.Fatal"
            exit 1
          fi
          echo "no-skip-assert: PASS"

      # Exit-0 pre-merge gate: all 5 webhook-resolution e2e scenarios must pass.
      # Timeout guard: 90s wall-clock cap per PLG-06 acceptance criteria.
      - name: e2e-tenantinjector (exit-0 pre-merge gate)
        run: go test -count=1 -timeout 90s -run E2E -v ./internal/plugins/tenantinjector/...

  # ── license-check allow/deny-matrix e2e gate ────────────────────────────
  # WI-4yaa.PLG-09 acceptance criterion: "CI workflow job e2e-licensecheck
  # runs go test ./internal/plugins/licensecheck/ -run E2E -v on every PR
  # and on merge to main; must exit 0 before merge."
  #
  # 6 scenarios (as-shipped single-backend contract, B-02 discovery):
  #   1. Token present + server validates → 200 pass-through
  #   2. Token present + server returns non-2xx → 403 vendor error
  #   3. Token header absent → 403
  #   4. License-server unreachable (connection refused) → 503 + dependency trace
  #   5. License-server timeout → 503 + dependency trace
  #   6. Cache hit within TTL (no extra outbound call) + LRU eviction at max_cache_size
  # No Docker / testcontainers needed — mock license-server is httptest.Server.
  # Runs independently of ci-go so failures are reported distinctly.
  e2e-licensecheck:
    name: E2E — license-check allow/deny matrix (6 scenarios, exit-0 gate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # Verify no t.Skip* calls slipped into the e2e file (integration-test-discipline).
      # Comment-only lines (// ...) are excluded from the match.
      - name: Assert no t.Skip in e2e test file
        run: |
          HITS=$(grep -n "t\.Skip\|t\.SkipNow\|t\.Skipf" \
                   internal/plugins/licensecheck/licensecheck_e2e_test.go \
                 | grep -v "^[0-9]*:[[:space:]]*//" || true)
          if [ -n "$HITS" ]; then
            echo "${HITS}"
            echo "::error::t.Skip* call found in licensecheck_e2e_test.go — integration-test-discipline forbids silent skip; use t.Fatal"
            exit 1
          fi
          echo "no-skip-assert: PASS"

      # Exit-0 pre-merge gate: all 6 allow/deny-matrix e2e scenarios must pass.
      # Timeout guard: 90s wall-clock cap per PLG-09 acceptance criteria.
      - name: e2e-licensecheck (exit-0 pre-merge gate)
        run: go test -count=1 -timeout 90s -run E2E -v ./internal/plugins/licensecheck/...

  # ── prompt-sanitize PII corpus e2e gate ─────────────────────────────────
  # WI-4yaa.PLG-12 acceptance criterion: "CI workflow job e2e-promptsanitize
  # runs go test ./internal/plugins/promptsanitize/ -run E2E -v on every PR
  # and on merge to main; must exit 0 before merge."
  #
  # 5 canonical scenarios (PII payload corpus):
  #   1. Regex redact — email PII replaced with [REDACTED]; INFO log; 200 forward
  #   2. Keyword reject — injection phrase → 412 + clarification body
  #   3. No match — clean prompt passes through unmodified (200)
  #   4. Multiple regex matches — email + SSN both redacted in one body
  #   5. First-reject-wins — two reject patterns; first match name in requiredInputs
  # Bonus: SSN corpus, credit-card reject, ContentLength update, upstream ReadAll.
  # No Docker / testcontainers — all assertions use httptest + in-process plugin.
  # Runs independently of ci-go so failures are reported distinctly.
  e2e-promptsanitize:
    name: E2E — prompt-sanitize PII corpus (5 scenarios, exit-0 gate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # Verify no t.Skip* calls slipped into the e2e file (integration-test-discipline).
      # Comment-only lines (// ...) are excluded from the match.
      - name: Assert no t.Skip in e2e test file
        run: |
          HITS=$(grep -n "t\.Skip\|t\.SkipNow\|t\.Skipf" \
                   internal/plugins/promptsanitize/promptsanitize_e2e_test.go \
                 | grep -v "^[0-9]*:[[:space:]]*//" || true)
          if [ -n "$HITS" ]; then
            echo "${HITS}"
            echo "::error::t.Skip* call found in promptsanitize_e2e_test.go — integration-test-discipline forbids silent skip; use t.Fatal"
            exit 1
          fi
          echo "no-skip-assert: PASS"

      # Exit-0 pre-merge gate: all PII corpus e2e scenarios must pass.
      # Timeout guard: 60s wall-clock cap per PLG-12 acceptance criteria.
      - name: e2e-promptsanitize (exit-0 pre-merge gate)
        run: go test -count=1 -timeout 60s -run E2E -v ./internal/plugins/promptsanitize/...

  # ── Python: ruff + mypy + pip-audit + pytest ─────────────────────────────
  # Matrix over the three Python packages; fail-fast=false so all three report.
  # Each package's pyproject.toml already carries --cov-fail-under=80.
  ci-python:
    name: Python — ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [sdk-fastapi, client-python, cli]

    defaults:
      run:
        working-directory: ${{ matrix.pkg }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.pkg }}/pyproject.toml

      - name: Install package + test dependencies
        run: pip install ".[test]"

      # ruff: fast linter (E, F, I, UP, B, SIM per pyproject.toml)
      - name: ruff check
        run: ruff check src

      # mypy: strict type-checking (strict = true per pyproject.toml)
      - name: mypy
        run: mypy src

      # pip-audit: vulnerability scan of the installed environment (OSV database).
      # Step name resolves to pip-audit-sdk-fastapi / pip-audit-client-python /
      # pip-audit-cli per matrix (WI-2yaa.NFR-SDK-1 / NFR-PYC-1 / NFR-CLI-1).
      # Exits 1 on any vulnerability (satisfies HIGH/CRITICAL threshold);
      # zero findings expected on v0.2.0 packages (no runtime CVEs).
      - name: pip-audit-${{ matrix.pkg }}
        run: pip-audit

      # pytest: unit tests + coverage gate (--cov-fail-under=80 in pyproject.toml)
      - name: pytest (≥80% coverage gate)
        run: pytest

  # ── TypeScript: eslint + tsc + pnpm audit + vitest ───────────────────────
  ci-ts:
    name: TypeScript — @aimpathyminds/yaagents-client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-ts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # eslint: lint src + tests
      - name: eslint
        run: pnpm run lint

      # tsc --noEmit: full type-check without emitting output files
      - name: tsc --noEmit
        run: pnpm run typecheck

      # pnpm audit: vulnerability scan of the dependency graph (HIGH+).
      # Step name: pnpm-audit-client-ts (WI-2yaa.NFR-TS-1; lockfile=pnpm-lock.yaml → pnpm).
      # Exits 1 on any HIGH/CRITICAL advisory. 0 findings expected on v0.2.0
      # (vitest bumped to 4.1.8 to fix GHSA-5xrq-8626-4rwp CRITICAL).
      - name: pnpm-audit-client-ts
        run: pnpm audit --audit-level=high

      # vitest: unit tests + coverage (≥80% gate in vitest.config.ts thresholds)
      - name: vitest + coverage (≥80% gate)
        run: pnpm run test

  # ── No dynamic plugin loading gate ──────────────────────────────────────────
  # ADR PI2-yaa-0001 §3 forbids plugin.Open() and dlopen at any call site.
  # Community plugins are compiled-in via Go module imports; no dynamic loading.
  # NFR-PLG-1: grep exits 0 on clean code; exits 1 when plugin.Open appears in
  # non-comment source (verified: inject plugin.Open into a test file → FAIL).
  # Comment-only lines (doc references like "no plugin.Open / dlopen") are
  # excluded via the second grep filter to avoid false positives from ADR docs.
  no-dynamic-load-scan:
    name: No dynamic plugin loading (plugin.Open / dlopen)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: no-dynamic-load-scan
        run: |
          # Strip comment-only lines from matches: grep output is
          # "file:linenum:content"; exclude lines where content starts with //.
          HITS=$(grep -rn --include="*.go" \
                 "plugin\.Open\|dlopen" \
                 gateway/internal/plugins/ gateway/plugin/ \
                 | grep -v ':[0-9]*:[[:space:]]*//')
          if [ -n "$HITS" ]; then
            echo "${HITS}"
            echo "::error::Dynamic plugin loading detected — ADR PI2-yaa-0001 §3 forbids plugin.Open/dlopen. Community plugins must be compiled in via Go module imports."
            exit 1
          fi
          echo "no-dynamic-load-scan: PASS — no dynamic loading calls found"

  # ── License clean scan: no Community License string in source ────────────
  # Blocks regression to the v0.1.x "YAAgents Community License" identifier.
  # Runs on push events only (not pull_request) — advisory, to avoid blocking
  # external fork contributors who cannot easily run the check locally.
  # Also invoked by bin/pi2-yaa-gate.sh step 7. ADR: PI2-yaa-0003.
  license-clean-scan:
    name: License clean scan — no Community License strings
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: license-clean-scan
        run: |
          if grep -rn "YAAgents Community License" \
               --include='*.go' --include='*.py' --include='*.ts' .; then
            echo "::error::Community License string found in source — see grep output above"
            exit 1
          fi
          echo "license-clean-scan: PASS — no Community License strings found"

  # ── No secrets in Dockerfile / no .env files in repo ────────────────────
  # Blocks any ENV instruction that bakes a secret value into the gateway
  # image layer. Runs on all push + pull_request events (security-critical;
  # not advisory like license-clean-scan). ADR: PI1-yaa-0001 §3 + NFR-GW-1.
  no-secret-in-dockerfile:
    name: No secrets in Dockerfile or .env files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: no-secret-in-dockerfile
        run: |
          if grep -rnE "ENV.*(SECRET|TOKEN|PASSWORD).*=" docker/gateway/; then
            echo "::error::Secret ENV instruction found in Dockerfile — all secrets are runtime-only (inject via orchestrator)"
            exit 1
          fi
          echo "no-secret-in-dockerfile: PASS — no secret ENV instructions found"

      - name: no-env-files-in-repo
        run: |
          DOTENV=$(git ls-files "*.env" ".env*")
          if [ -n "${DOTENV}" ]; then
            echo "::error::.env file committed to repo: ${DOTENV}"
            exit 1
          fi
          echo "no-env-files-in-repo: PASS — no .env files tracked"

  # ── Spec archive: schemas/ + openapi/ → GitHub Release ───────────────────
  # Runs only on tag push, and only after all three language jobs are green.
  # ADR PI1-yaa-0005 §6: schemas + OpenAPI attached as versioned archive;
  # no separate spec registry in PI1-yaa.
  spec-archive:
    name: Attach spec archive to Release
    needs: [ci-go, e2e-tokenvalidator, e2e-tenantinjector, e2e-licensecheck, e2e-promptsanitize, ci-python, ci-ts]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update GitHub Release + upload asset

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create versioned spec archive
        id: archive
        run: |
          VERSION="${GITHUB_REF_NAME}"            # e.g. v0.1.0
          ARCHIVE="yaagents-spec-${VERSION}.zip"
          zip -r "${ARCHIVE}" schemas/ openapi/
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Created ${ARCHIVE} ($(du -sh "${ARCHIVE}" | cut -f1))"

      - name: Attach spec archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: false   # gateway-image.yml handles release notes
