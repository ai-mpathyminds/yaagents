# .github/workflows/npm-publish.yml
# WI-4yaa.LA-NPM  — npm publish @aimpathyminds/yaagents-client @ 0.4.0 (release-wave sync)
# WI-2yaa.REL-2   — npm re-publish @ 0.2.0 (OIDC provenance)
# WI-1yaa.REL-4 — original authoring; updated for v0.2 Apache 2.0 + profile
# ADR PI1-yaa-0003 — dual ESM+CJS via tsup
# ADR PI1-yaa-0005 — no long-lived token; npm publish --provenance via OIDC (2 SLSA attestations)
# ADR PI2-yaa-0003 — Apache 2.0 license metadata (supersedes Community License)
#
# Package: @aimpathyminds/yaagents-client
# Publishes ESM + CJS + .d.ts bundle to npmjs.com/package/@aimpathyminds/yaagents-client
# Auth:    NODE_AUTH_TOKEN = npm Granular Access Token (external setup; NOT NPM_TOKEN)
#          No NPM_TOKEN secret in repo (AC: WI-1yaa.REL-4)
# OIDC:    id-token: write → npm attaches a SLSA provenance attestation at publish
#
# External setup (Phase-B dependency):
#   1. Create an npm Granular Access Token scoped to @aimpathyminds/yaagents-client
#      with "publish" permission (npmjs.com → Account → Access Tokens → Generate New Token)
#   2. Add it as GH repo secret NODE_AUTH_TOKEN (NOT NPM_TOKEN)
#   3. Create GitHub Actions environment "npm" with tag-ref protection (v*.*.*)
#      to prevent accidental publishes from branch pushes

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v0.4.0, v1.2.3, …

permissions:
  id-token: write   # OIDC token for npm provenance attestation (--provenance)

jobs:
  publish:
    name: Build and publish @aimpathyminds/yaagents-client
    runs-on: ubuntu-latest
    environment: npm   # tag-only protection; matches external setup step 3

    defaults:
      run:
        working-directory: client-ts

    steps:
      # ── checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── toolchain ────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'   # writes ~/.npmrc auth stub

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # ── install ───────────────────────────────────────────────────────────
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ── quality gates before publish ─────────────────────────────────────
      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (unit + coverage)
        run: pnpm run test

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # ── PRE-PUBLISH GATE: community-license + source-available grep ─────────
      # WI-2yaa.REL-2 + NFR-REL-1: zero "Community License" or "source-available"
      # hits in client-ts/ (source + built artefacts) before publish.
      # Prevents a regression from reaching the public npm registry.
      # ADR PI2-yaa-0003.
      - name: license-clean-scan (pre-publish gate)
        working-directory: .
        run: |
          if grep -rnE "Community License|source-available" \
               --include='*.ts' --include='*.js' --include='*.mjs' --include='*.cjs' \
               --include='*.json' \
               client-ts/src client-ts/dist 2>/dev/null; then
            echo "::error::Community License or source-available string found in client-ts — cannot publish. See ADR PI2-yaa-0003."
            exit 1
          fi
          echo "license-clean-scan: PASS — no Community License / source-available strings found"

      # ── build (dual ESM + CJS) ────────────────────────────────────────────
      - name: Build dual-bundle (tsup)
        run: pnpm run build

      - name: Verify dual-bundle outputs
        run: |
          test -f dist/index.mjs  || { echo "ERROR: ESM output missing (dist/index.mjs)";  exit 1; }
          test -f dist/index.cjs  || { echo "ERROR: CJS output missing (dist/index.cjs)";  exit 1; }
          test -f dist/index.d.ts || { echo "ERROR: types missing (dist/index.d.ts)";       exit 1; }
          echo "OK  dual-bundle: dist/index.{mjs,cjs,d.ts} present"

      - name: Verify PROFILE_VERSION export — CJS
        run: |
          # Smoke-test the CJS bundle (Node require path).
          # WI-4yaa.LA-NPM AC: PROFILE_VERSION exports v0.3 from both ESM + CJS (Profile unchanged at v0.4.0).
          node -e "
            const { PROFILE_VERSION } = require('./dist/index.cjs');
            if (PROFILE_VERSION !== 'v0.3') throw new Error('CJS PROFILE_VERSION=' + PROFILE_VERSION + ' expected v0.3');
            console.log('OK  CJS PROFILE_VERSION=' + PROFILE_VERSION);
          "

      - name: Verify PROFILE_VERSION export — ESM
        run: |
          # Smoke-test the ESM bundle (Node --input-type=module).
          # WI-4yaa.LA-NPM AC: PROFILE_VERSION exports v0.3 from both ESM + CJS (Profile unchanged at v0.4.0).
          node --input-type=module - <<'ESEOF'
          import { PROFILE_VERSION } from './dist/index.mjs';
          if (PROFILE_VERSION !== 'v0.3') throw new Error('ESM PROFILE_VERSION=' + PROFILE_VERSION + ' expected v0.3');
          console.log('OK  ESM PROFILE_VERSION=' + PROFILE_VERSION);
          ESEOF

      - name: Verify package.json license field
        # WI-2yaa.REL-2 AC: npm view ... license → Apache-2.0 (ADR PI2-yaa-0003).
        # Pre-publish assertion from package.json (source of truth for npm metadata).
        run: |
          LICENSE=$(node -p "require('./package.json').license")
          if [ "${LICENSE}" != "Apache-2.0" ]; then
            echo "::error::package.json license=${LICENSE} — expected Apache-2.0 (ADR PI2-yaa-0003)"
            exit 1
          fi
          echo "OK  package.json license=${LICENSE}"

      # ── publish to npm (with OIDC provenance) ────────────────────────────
      # --provenance: npm CLI uses the OIDC token (id-token: write above) to
      #   generate and attach a SLSA provenance attestation, linking the
      #   published package to this exact workflow run / commit / repo.
      # --access public: required for scoped packages (@aimpathyminds/*).
      # NODE_AUTH_TOKEN: Granular Access Token (not NPM_TOKEN) — see external setup.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
