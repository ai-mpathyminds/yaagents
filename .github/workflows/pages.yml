# Deploy Pages site — Astro Starlight → GitHub Pages
#
# ADR PI3-yaa-0004: site hosted at ai-mpathyminds.github.io/yaagents/
# (project-pages mode; astro base: '/yaagents').
#
# Stub: platform-engineer A-4 (B-34 NFR-SRE-2) appends:
#   - Lighthouse CI step (≥90 Perf + A11y budget gate)
#   - build-failure-blocks-PR enforcement on PR triggers
#
# Actions used:
#   actions/checkout@v4
#   pnpm/action-setup@v3
#   actions/setup-node@v4
#   actions/configure-pages@v5
#   actions/upload-pages-artifact@v3
#   actions/deploy-pages@v4

name: Deploy Pages site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'spec/**'
      - 'schemas/**'
      - 'openapi/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Build site
        run: pnpm build
        working-directory: docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - id: deployment
        uses: actions/deploy-pages@v4
